name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Permit the installed Chromium binary to create its sandbox
        run: |
          sudo install -m 0644 ci/chromium.apparmor /etc/apparmor.d/kite-browser-ci
          sudo apparmor_parser -r /etc/apparmor.d/kite-browser-ci
      - run: BROWSER_CHANNEL=chromium npm test
